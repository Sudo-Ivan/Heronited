name: Release

# A release starts in one of two ways:
# - "Run workflow" in the Actions tab, picking the bump: the version in
#   Cargo.toml is bumped, committed to main and tagged;
# - pushing a `vX.Y.Z` tag by hand (Cargo.toml must already have X.Y.Z).
# Then, from the tag and side by side, the AppImage and the .deb / .rpm / Arch
# packages are built and checked on clean containers (job appimage), the
# Flatpak bundle is built (job flatpak), and the Windows installer and
# portable zip are built and checked (job windows). All of it is x86_64.
# Every file carries a SLSA build provenance attestation from the job that
# built it; check a download with:
#   gh attestation verify <file> --repo Sudo-Ivan/Heronited
# The publish job gathers them, signs them (secret MINISIGN_SECRET_KEY, see
# scripts/sign-release.sh) and publishes them as one GitHub release. The
# Flatpak bundle is not attached to the release (a bundle gets no updates):
# it stays an artifact of the run, and a release whose Flatpak does not
# build fails.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The Google app Google Drive signs in with (Settings → Cloud), built into
  # the binaries (heronite_sync::prefs::SyncPrefs::google_app). Without these
  # secrets the release uses rclone's own Google app, whose request quota is
  # shared by everyone using rclone.
  HERONITE_GOOGLE_CLIENT_ID: ${{ secrets.HERONITE_GOOGLE_CLIENT_ID }}
  HERONITE_GOOGLE_CLIENT_SECRET: ${{ secrets.HERONITE_GOOGLE_CLIENT_SECRET }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the bump commit and its tag to main
    outputs:
      tag: ${{ steps.bump.outputs.tag || steps.pushed.outputs.tag }}
    steps:
      # Always main (or the pushed tag), never a pull request's own code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bump, commit and tag
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(scripts/bump-version.py "$INPUT_BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          # The token goes on the push's URL only: nothing is written to the
          # repo's config (persist-credentials stays off).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the pushed tag
        id: pushed
        if: github.event_name == 'push'
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$CARGO" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  appimage:
    name: AppImage and packages (x86_64)
    needs: version
    # The oldest supported Ubuntu: the AppImage runs on systems with this
    # glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # OIDC token for the SLSA provenance attestation
      attestations: write # pushes the attestation to this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: System packages
        run: scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Builds the published files: reads the shared cache but adds nothing to
      # it, so a poisoned entry cannot come from this run (and this run alone
      # cannot poison it for others).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          lookup-only: true
      - name: Build
        run: cargo build --release --locked -p heronite -p heronite-epic-login
      - name: appimagetool and nfpm
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # zsyncmake writes the .zsync of the update information; patchelf
          # points the app at the libraries the AppImage bundles. bison,
          # ninja and meson build its libxkbcommon (scripts/xkbcommon.sh).
          sudo apt-get install -y --no-install-recommends zsync patchelf bison ninja-build
          pipx install 'meson>=1.4'
          # nfpm builds the .deb, .rpm and Arch packages (pinned build).
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/appimage.sh
      - name: System packages
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: scripts/packages.sh "${TAG#v}"
      # Installs each package on clean Ubuntu 22.04 / 24.04, Debian 12,
      # Fedora and Arch containers: a wrong dependency name fails here. Runs
      # the AppImage on containers with only glibc and libxcb: a library it
      # should bundle fails here.
      - name: Check the packages
        run: scripts/package-smoke.sh
      # SLSA provenance for everything the job built, before anything leaves
      # the runner: the attested hashes are what the release publishes.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      # Not signed yet: the publish job signs them with the Windows files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Heronited-linux
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (x86_64)
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for the SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: flatpak-builder
        run: scripts/ci-flatpak-deps.sh
      # No cache: this job builds files a release ships, and a cache key
      # shared with pull request runs could be poisoned from there.
      - name: Build
        run: scripts/flatpak.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/Heronited-x86_64.flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Heronited-flatpak
          path: dist/Heronited-x86_64.flatpak
          if-no-files-found: error

  windows:
    name: Windows installer and portable zip (x86_64)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the SLSA provenance attestation
      attestations: write
    outputs:
      signed: ${{ steps.cert.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          lookup-only: true
      - name: Inno Setup
        run: |
          # Preinstalled on windows-latest (6.7.1 on the Windows Server 2025
          # image); the pinned official installer if an image drops it.
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if ((Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or ($known | Where-Object { Test-Path $_ })) {
            Write-Host 'Inno Setup is installed'
            exit 0
          }
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe' -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0') { throw "Inno Setup installer checksum mismatch: $hash" }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer failed ($($p.ExitCode))" }
      # Authenticode, once there is a certificate: the secrets
      # WINDOWS_SIGN_PFX_BASE64 (a base64 .pfx) and WINDOWS_SIGN_PASSWORD
      # sign heronite-rs.exe, heronite-epic-login.exe, the setup and its
      # uninstaller (see scripts/windows/sign.ps1, which also takes a
      # WINDOWS_SIGN_COMMAND, for Azure Trusted Signing for example).
      # Without them nothing is signed and the release notes warn about
      # SmartScreen.
      - name: Code signing certificate
        id: cert
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host 'No WINDOWS_SIGN_PFX_BASE64 secret: the Windows files are not Authenticode-signed.'
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'heronited-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Package
        env:
          TAG: ${{ needs.version.outputs.tag }}
          WINDOWS_SIGN_PFX: ${{ steps.cert.outputs.pfx }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./scripts/windows/package.ps1 -Version $env:TAG.Substring(1)
      # The zip's layout and its login window (--smoke); a silent install,
      # an update over it with /WAITPID and a silent uninstall on the runner.
      - name: Check the packages
        run: ./scripts/windows/smoke.ps1
      # SLSA provenance, after any Authenticode signature is in place: the
      # attested hashes are what the release publishes.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/Heronited-Setup-x86_64.exe
            dist/Heronited-Portable-x86_64.zip
      # Not minisign-signed yet: the publish job signs them with the Linux
      # files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Heronited-windows
          path: |
            dist/Heronited-Setup-x86_64.exe
            dist/Heronited-Portable-x86_64.zip
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [version, appimage, flatpak, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the GitHub release
      id-token: write # OIDC token for the SLSA provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          # The release notes read the history back to the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Heronited-linux
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Heronited-windows
          path: dist
      - name: minisign
        run: |
          # minisign signs the files for the in-app updater (pinned build).
          curl -fsSL -o "$RUNNER_TEMP/minisign.tar.gz" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          sudo install -m755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
      # The in-app updater only installs files listed in SHA256SUMS, signed
      # with the key whose public half is built into the app
      # (crates/update/src/lib.rs); until the switch, every file is also
      # signed on its own for the versions up to 1.0
      # (scripts/sign-release.sh, PER_FILE_SIGNATURES).
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          for f in Heronited-x86_64.AppImage Heronited-Setup-x86_64.exe Heronited-Portable-x86_64.zip; do
            [[ -f dist/$f ]] || { echo "::error::dist/$f is missing"; exit 1; }
          done
          scripts/sign-release.sh "${TAG#v}" dist
          ls -l dist
      # The binaries were attested by the jobs that built them; this job
      # attests what it creates itself: the checksums and the signatures.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/*.minisig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Heronited-release
          path: dist/*
          overwrite: true
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: git-cliff
      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          # cliff.toml groups the commits since the previous tag by type
          # (feat, fix, perf...). The first release has no previous tag, so it
          # gets a short note instead of the whole development history.
          # A short guide to the assets goes first: the .minisig and .zsync
          # files sit next to the downloads but are only for the updaters.
          cat > notes.md <<'EOF'
          **Linux:** `Heronited-x86_64.AppImage` runs on any distribution (recommended). Or the package for your system: `.deb` (Debian, Ubuntu, Mint), `.rpm` (Fedora, openSUSE), `.pkg.tar.zst` (Arch, CachyOS).

          **Windows 10 and 11:** `Heronited-Setup-x86_64.exe` installs Heronited for your user, no administrator rights needed (recommended). `Heronited-Portable-x86_64.zip` runs from any folder you extract it to and keeps its library and settings in that folder.
          EOF
          # Until the Windows files are code-signed (see the windows job).
          if [[ $WINDOWS_SIGNED != true ]]; then
            truncate -s -1 notes.md
            printf ' They are not code-signed yet, so Windows SmartScreen may say "Windows protected your PC": choose **More info**, then **Run anyway**.\n' >> notes.md
          fi
          printf '\n`SHA256SUMS` lists the SHA-256 of every file (signed in `SHA256SUMS.minisig`). The `.minisig` and `.zsync` files are for the updaters; you do not need them. Every file has SLSA build provenance: `gh attestation verify <file> --repo Sudo-Ivan/Heronited` checks it came from this repository'\''s release workflow.\n\n' >> notes.md
          if [[ $(git tag --list 'v*' | wc -l) -le 1 ]]; then
            printf 'First public release of Heronited. See the [README](https://github.com/Sudo-Ivan/Heronited#readme) for what it can do.\n' >> notes.md
          else
            git cliff --latest --strip all >> notes.md
          fi
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "Heronited $TAG" --notes-file notes.md
