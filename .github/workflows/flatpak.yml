name: Flatpak

# Builds the Flatpak the way a release does (scripts/flatpak.sh) and keeps
# the bundle as a workflow artifact for trying out. Never published:
# releases are made by release.yml.
on:
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "packaging/linux/**"
      - "scripts/flatpak.sh"
      - "scripts/ci-flatpak-deps.sh"
      - "crates/platform/src/flatpak.rs"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Flatpak bundle (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: flatpak-builder
        run: scripts/ci-flatpak-deps.sh
      # The downloads (crates, the tools' sources) and the tools' builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/flatpak/state
          key: flatpak-${{ hashFiles('packaging/flatpak/io.github.sudoivan.Heronited.yml', 'Cargo.lock') }}
          restore-keys: flatpak-
      - name: Build
        run: scripts/flatpak.sh
      # What Flathub's reviewers run on the submission: its linter on the
      # manifest, the AppStream data and the repository the build made.
      - name: Lint
        run: |
          lint() { flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@"; }
          lint manifest packaging/flatpak/io.github.sudoivan.Heronited.yml
          lint appstream packaging/linux/io.github.sudoivan.Heronited.metainfo.xml
          lint repo target/flatpak/repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Heronited-flatpak
          path: dist/Heronited-x86_64.flatpak
          if-no-files-found: error
