name: Security

# zizmor lints the workflows on every change to them. cargo audit checks
# Cargo.lock against the RustSec advisory database when it changes and once
# a week (advisories are published between changes).
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "app/Cargo.toml"]
  pull_request:
    paths: [".github/workflows/**", "Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "app/Cargo.toml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor (workflow lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run --spec zizmor==1.31.1 zizmor .github/workflows/
      - name: Job timeouts
        run: python3 scripts/check-workflow-timeouts.py

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Prebuilt binary: `cargo install cargo-audit` compiled it from source
      # on every run.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
