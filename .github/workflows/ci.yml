name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/screenshots/**", "docs/**", "licenses/**", ".github/ISSUE_TEMPLATE/**", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "assets/screenshots/**", "docs/**", "licenses/**", ".github/ISSUE_TEMPLATE/**", ".github/dependabot.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once per job: incremental bookkeeping is pure overhead, and a
  # retried crates.io fetch should not fail the run.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  # No debug info in CI: faster builds and a smaller cache. Backtraces still
  # name the functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Clippy and the tests are two jobs so they run side by side: the test
  # build is the long one, and clippy's checking shares nothing with it.
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      # Cheapest check first: it needs no system packages and no build.
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: System packages
        run: scripts/ci-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Pull requests read main's cache but do not save their own, so the
          # 10 GB cache quota is not filled with short-lived entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: System packages
        run: scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  # Keep the Windows port building: the same clippy and tests on Windows
  # (formatting is the same on both, the Linux job checks it).
  windows-clippy:
    name: Clippy (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # lld links several times faster than link.exe (build scripts and
      # proc macros here). .cargo/config.toml does the same on Linux.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows-tests:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # With link.exe, linking the ~55 test programs took about half of the
      # test build. Releases still link with link.exe (scripts/windows/package.ps1).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --no-fail-fast
