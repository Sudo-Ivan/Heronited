version: 2
updates:
  # Actions pinned to a commit stay pinned: the pull request updates the
  # hash (and the version comment). One grouped pull request a week keeps
  # the CI queue free instead of a storm of one-job-each updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Patch and minor bumps in one pull request; major bumps on their own
    # (they are the ones that need a look).
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 4
    # The workspace's own crates are path-only members; there is nothing to
    # bump in them.
    ignore:
      - dependency-name: "heronite*"
      - dependency-name: "gpui-zoom"
