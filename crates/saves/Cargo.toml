[package]
name = "heronite-saves"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client of a saves server (default saves.quad4.io): secure key sign-in, hashed snapshots of game saves, the game list that says where saves are"

[dependencies]
heronite-i18n = { path = "../i18n" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
ureq = "3"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
ed25519-dalek = "2.2"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
